---
# Security lockdown tasks - Lock down public access, allow only Tailscale

- name: Install UFW (Uncomplicated Firewall)
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
  become: true

- name: Reset UFW to default state
  community.general.ufw:
    state: reset
  become: true

- name: Set UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  become: true
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
    - { direction: routed, policy: allow }

# Allow Tailscale UDP port
- name: Allow Tailscale UDP port 41641
  community.general.ufw:
    rule: allow
    port: "41641"
    proto: udp
    comment: "Tailscale"
  become: true

# Allow SSH from anywhere initially (will rely on Tailscale SSH later)
# This is important to not lock ourselves out during bootstrap
- name: Allow SSH from anywhere (port 22)
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: "SSH (will transition to Tailscale SSH)"
  become: true

# Block Proxmox web interface from public internet
# It will only be accessible via Tailscale
- name: Block Proxmox web interface from public internet
  community.general.ufw:
    rule: deny
    port: "{{ proxmox_web_port }}"
    proto: tcp
    from_ip: any
    to_ip: any
    comment: "Block public Proxmox access"
  become: true

# Allow Proxmox web interface from Tailscale network
# Note: This will work once Tailscale is running and we know the CIDR
- name: Allow Proxmox web interface from Tailscale
  community.general.ufw:
    rule: allow
    port: "{{ proxmox_web_port }}"
    proto: tcp
    interface: "{{ tailscale_interface }}"
    direction: in
    comment: "Proxmox via Tailscale"
  become: true
  when: not skip_tailscale | default(false)

# Allow established connections
- name: Allow all established and related connections
  community.general.ufw:
    rule: allow
    direction: in
    proto: any
    from_ip: any
    to_ip: any
    comment: "Allow established connections"
  become: true

- name: Enable UFW
  community.general.ufw:
    state: enabled
  become: true

- name: Display firewall status
  ansible.builtin.command: ufw status verbose
  register: ufw_status
  changed_when: false
  become: true

- name: Show firewall configuration
  ansible.builtin.debug:
    msg: "{{ ufw_status.stdout_lines }}"
  when: tailscale_verbose | default(false)
