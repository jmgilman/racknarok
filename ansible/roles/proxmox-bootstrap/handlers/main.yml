---
# Handlers for proxmox-bootstrap role

- name: Restart Tailscale
  ansible.builtin.systemd:
    name: tailscaled
    state: restarted
  become: true

- name: Reload UFW
  ansible.builtin.systemd:
    name: ufw
    state: reloaded
  become: true

- name: Reload Proxmox web interface
  ansible.builtin.systemd:
    name: pveproxy
    state: reloaded
  become: true
