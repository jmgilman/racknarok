[defaults]
# Ansible configuration for Project Racknarok

# Roles path - look for roles in the local roles directory
roles_path = ./roles

# Collections path - use system default plus local
collections_path = ~/.ansible/collections:/usr/share/ansible/collections

# Host key checking - disable for initial bootstrap
# (Proxmox nodes may not have known host keys yet)
host_key_checking = False

# Retry files - disable to avoid clutter
retry_files_enabled = False

# Gathering - smart gathering to speed up playbooks
gathering = smart
fact_caching = memory
fact_caching_timeout = 3600

# Output
stdout_callback = yaml
callbacks_enabled = profile_tasks, timer

# SSH settings
timeout = 30
remote_user = root

# Privilege escalation
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[inventory]
# Enable Ansible inventory plugins
enable_plugins = host_list, yaml, ini, auto

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
# SSH multiplexing for better performance
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
