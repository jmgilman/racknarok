# Per-node Proxmox configuration
# Each node represents a physical server running Proxmox VE

nodes:
  - name: rk1
    # Basic identity
    fqdn: rk1.racknarok.internal
    datacenter: rbx  # OVH datacenter code

    # SSH access for bootstrap
    # This must be accessible before Tailscale is configured
    ssh_host: 15.204.85.151  # Public IP from secrets/proxmox/network.enc.yaml
    ssh_user: root
    ssh_port: 22

    # Network configuration
    network:
      # Public interface (from OVH)
      public:
        interface: eno1  # TODO: Verify actual interface name on server
        # Public IP and gateway are in secrets/proxmox/network.enc.yaml

      # vRack private network
      vrack:
        interface: eno2  # TODO: Verify actual interface name on server
        bridge: vmbr1    # Bridge name for VMs
        ip: 10.0.0.1/24
        gateway: null    # No gateway on private network
        vlan_aware: true # Enable VLAN support on bridge

    # Hardware details (for reference and capacity planning)
    hardware:
      cpu:
        model: "AMD Epyc 7413"
        cores: 24
        threads: 48
      memory:
        total_gb: 128
      disks:
        - device: /dev/nvme0n1
          size_gb: 960
          purpose: proxmox_os
        - device: /dev/nvme1n1
          size_gb: 960
          purpose: vm_storage

    # Storage configuration for this node
    storage:
      # Proxmox OS storage (disk 0)
      - name: local
        type: dir
        path: /var/lib/vz
        content: ["iso", "vztmpl", "backup"]
        disk: /dev/nvme0n1
        # Built-in, usually created by Proxmox installer

      # ZFS pool for VM images (disk 1)
      - name: nvme-pool
        type: zfs
        pool: rpool-vms
        content: ["images", "rootdir"]
        disk: /dev/nvme1n1
        compression: lz4
        # ZFS-specific options
        zfs_options:
          ashift: 12
          atime: off

      # LVM-thin for flexible VM storage
      - name: vm-storage
        type: lvm-thin
        vg: pve
        content: ["images"]

  # Future nodes (template for when we add more)
